include:
  - ../models/ours_m.yaml
  - ../data/sidd_lsdir.yaml
  - ../degradation/sidd_calibrated.yaml

bitrate:
  mode: learned_entropy
  denominator: image_pixels

loss:
  domain: camera
  reconstruction_loss: l1
  lambda_distortion: 1.0
  lambda_rate: 6.0e-4

train:
  seed: 10
  device: cuda
  lr: 5.0e-5
  aux_lr: 1.0e-3
  weight_decay: 0.0
  betas: [0.9, 0.999]
  max_steps: 100000
  log_every: 100
  val_every: 8000
  save_every: 4000
  max_grad_norm: 1.0
  amp: true
  amp_dtype: bfloat16
  allow_tf32: false
  float32_matmul_precision: highest
  lr_schedule: warmup_cosine
  lr_warmup_steps: 2000
  lr_start_ratio: 0.1
  lr_min_ratio: 1.0e-4
  checkpoint_dir: ${REPO_ROOT}/checkpoints/ours_m_lambda6e4_100k
  output_dir: ${REPO_ROOT}/outputs/ours_m_lambda6e4_100k
